<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9ec">
  <title>Скажи слово - тренажёр английского</title>
  <style>
    :root {
      color-scheme: light;
      font: 100%/1.5 system-ui, sans-serif;
      color: #241640;
      background: #fff9ec;
      --purple: #5125c2;
      --line: #e4daf0;
      --muted: #655775;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 48rem); margin: 0 auto; padding: clamp(1rem, 4vw, 3rem) 0; }
    header {
      position: relative;
      overflow: hidden;
      padding: clamp(1.25rem, 5vw, 3rem);
      background: #ffe078;
      border: 1px solid #e8b947;
      border-radius: 1.75rem;
    }
    h1, h2, p { margin: 0; }
    h1 { position: relative; z-index: 1; font-size: clamp(2.3rem, 7vw, 4.35rem); line-height: 1; letter-spacing: -.065em; }
    header p { position: relative; z-index: 1; max-width: 24rem; margin-top: .85rem; font-size: clamp(1rem, 3vw, 1.2rem); }
    .wave { position: absolute; right: 5%; top: 50%; display: flex; align-items: center; gap: .45rem; transform: translateY(-50%) rotate(-12deg); }
    .wave i { width: .65rem; border-radius: 2rem; background: #efbc4d; height: 2.1rem; }
    .wave i:nth-child(2), .wave i:nth-child(4) { height: 4rem; }
    .wave i:nth-child(3) { height: 6rem; }
    .panel {
      margin-top: 1rem;
      padding: clamp(.85rem, 3vw, 1.5rem);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      background: #fff;
    }
    fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
    legend { margin-bottom: .5rem; padding: 0; font-weight: 750; }
    .modes, .actions, .words { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem; }
    .modes { padding: .3rem; border-radius: 1rem; background: #f1eafa; }
    .mode { position: relative; cursor: pointer; }
    .mode input { position: absolute; opacity: 0; }
    .mode span {
      display: grid;
      min-height: 3rem;
      place-items: center;
      padding: .4rem .25rem;
      border-radius: .75rem;
      text-align: center;
      font-size: clamp(.8rem, 3vw, 1rem);
      font-weight: 750;
    }
    .mode input:checked + span { background: var(--purple); color: white; }
    button:focus-visible, .mode input:focus-visible + span { outline: 3px solid #00665f; outline-offset: 3px; }
    .actions { margin-top: 1rem; }
    button { min-height: 2.75rem; font: inherit; color: inherit; cursor: pointer; }
    .action {
      min-height: 3.8rem;
      padding: .5rem .3rem;
      border: 1px solid transparent;
      border-radius: .9rem;
      font-size: clamp(1rem, 4vw, 1.28rem);
      font-weight: 800;
    }
    #start { color: #fff; background: var(--purple); }
    #start[data-listening="true"] { background: #a72748; }
    #translate { background: #d5f4de; border-color: #b7dfc3; }
    #start:disabled, #translate:disabled { color: #62576f; background: #f1edf5; border-color: #e5deed; cursor: default; }
    @media (hover: hover) {
      .action:not(:disabled):hover { filter: brightness(.93); }
      .history-item:not(:disabled):hover, #replay:not(:disabled):hover { background: #eae0fa; }
    }
    #status { margin: .7rem 0; min-height: 1.5em; color: var(--muted); }
    #status[data-error="true"], .notice { color: #892040; }
    .notice { padding: .65rem .8rem; margin-top: .75rem; border-radius: .7rem; background: #fff1f4; }
    .word {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 6.5rem;
      gap: .25rem;
      padding: .75rem .85rem;
      border-radius: .95rem;
      background: #f5f0ff;
    }
    .word:last-child { background: #ecf9ee; }
    .word h2 { font-size: .9rem; color: var(--muted); }
    .value { font-size: clamp(1.35rem, 5vw, 2.15rem); font-weight: 780; line-height: 1.2; overflow-wrap: anywhere; }
    .placeholder { color: var(--muted); }
    #replay { align-self: flex-start; margin-top: .25rem; padding: .2rem .55rem; border: 1px solid #abcbb4; border-radius: .65rem; background: #fff; font-weight: 650; }
    #history-title { font-size: 1.3rem; line-height: 1.2; }
    #empty { margin-top: .55rem; color: var(--muted); }
    #history { margin: .65rem 0 0; padding: 0; list-style: none; }
    #history:empty { display: none; }
    #history li + li { margin-top: .35rem; }
    .history-item {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: .65rem;
      padding: .55rem .75rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: #fbf8ff;
      text-align: left;
    }
    .history-item:disabled { cursor: default; }
    .history-item span { min-width: 0; overflow-wrap: anywhere; }
    .history-item small { font-size: .75rem; font-weight: 750; color: var(--muted); }
    @media (max-width: 30rem) {
      .wave { right: -1.8rem; opacity: .65; }
      header p { max-width: 16rem; }
      .words { grid-template-columns: 1fr; }
      .word { min-height: 4.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1>Скажи слово</h1>
      <p>Произнеси слово, вспомни его перевод и проверь себя</p>
    </header>
    <section class="panel" aria-label="Тренажёр">
      <fieldset>
        <legend>Направление перевода</legend>
        <div class="modes">
          <label class="mode"><input type="radio" name="mode" value="en" checked><span>Английский → Русский</span></label>
          <label class="mode"><input type="radio" name="mode" value="ru"><span>Русский → Английский</span></label>
        </div>
      </fieldset>
      <p id="mic-notice" class="notice" role="alert" hidden></p>
      <div class="actions">
        <button id="start" class="action" type="button"><span aria-hidden="true">🎤</span> Старт</button>
        <button id="translate" class="action" type="button" disabled><span aria-hidden="true">🔍</span> Перевод</button>
      </div>
      <p id="status" role="status" aria-live="polite">Нажмите «Старт» и скажите слово по-английски</p>
      <div class="words">
        <section class="word">
          <h2>Что услышал браузер</h2>
          <p id="heard" class="value placeholder" aria-live="polite">…</p>
        </section>
        <section class="word">
          <h2>Перевод</h2>
          <p id="answer" class="value placeholder" aria-live="polite">…</p>
          <button id="replay" type="button" hidden><span aria-hidden="true">🔊</span> Повторить</button>
        </section>
      </div>
      <p id="voice-notice" class="notice" role="status" hidden></p>
    </section>
    <section class="panel" aria-labelledby="history-title">
      <h2 id="history-title">Последние 5 слов</h2>
      <p id="empty">Здесь появятся слова после перевода</p>
      <ol id="history"></ol>
    </section>
  </main>
  <script>
    'use strict'

    const byId = (id) => document.getElementById(id)
    const start = byId('start')
    const translate = byId('translate')
    const replay = byId('replay')
    const heard = byId('heard')
    const answer = byId('answer')
    const status = byId('status')
    const micNotice = byId('mic-notice')
    const voiceNotice = byId('voice-notice')
    const historyList = byId('history')
    const locales = { en: 'en-US', ru: 'ru-RU' }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
    const synthesis = window.speechSynthesis
    const canSpeak = Boolean(synthesis && window.SpeechSynthesisUtterance)
    const canRecord = Boolean(SpeechRecognition && window.isSecureContext)
    const historyKey = 'say-a-word.history.v1'
    const historyLimit = 5

    let source = document.querySelector('input[name="mode"]:checked').value
    let transcript = ''
    let translation = ''
    let recording = null
    let listening = false
    let request = null
    let voicePrimed = false
    const history = readHistory()
    const targetLanguage = () => source === 'en' ? 'ru' : 'en'

    function readHistory() {
      try {
        const items = JSON.parse(localStorage.getItem(historyKey) || '[]')
        return Array.isArray(items) ? items.filter((item) =>
          item && ['en', 'ru'].includes(item.source) &&
          typeof item.word === 'string' && item.word.trim() &&
          typeof item.translation === 'string' && item.translation.trim()
        ).slice(0, historyLimit) : []
      } catch {
        return []
      }
    }

    function renderHistory() {
      historyList.replaceChildren()
      byId('empty').hidden = history.length > 0
      for (const entry of history) {
        const target = entry.source === 'en' ? 'ru' : 'en'
        const item = document.createElement('li')
        const button = document.createElement('button')
        const icon = document.createElement('span')
        const words = document.createElement('span')
        const original = document.createElement('span')
        const translated = document.createElement('strong')
        const direction = document.createElement('small')
        button.type = 'button'
        button.className = 'history-item'
        icon.setAttribute('aria-hidden', 'true')
        icon.textContent = '🔊'
        original.lang = locales[entry.source]
        original.textContent = entry.word
        translated.lang = locales[target]
        translated.textContent = entry.translation
        direction.textContent = entry.source === 'en' ? 'EN → RU' : 'RU → EN'
        button.setAttribute('aria-label', `Прослушать перевод: ${entry.word} → ${entry.translation}`)
        words.append(original, ' → ', translated)
        button.append(icon, words, direction)
        button.disabled = !canSpeak
        button.addEventListener('click', () => {
          if (recording) resetRound()
          speak(entry.translation, target)
        })
        item.append(button)
        historyList.append(item)
      }
    }

    function save(word, result, language) {
      history.unshift({ word, translation: result, source: language })
      history.length = Math.min(history.length, historyLimit)
      try {
        localStorage.setItem(historyKey, JSON.stringify(history))
      } catch {
        // The session history still works when storage is blocked.
      }
      renderHistory()
    }

    function setStatus(message, error = false) {
      status.textContent = message
      status.dataset.error = String(error)
    }

    function showVoiceNotice(message = '') {
      voiceNotice.textContent = message
      voiceNotice.hidden = !message
    }

    function update() {
      heard.textContent = transcript || '…'
      heard.lang = locales[source]
      heard.classList.toggle('placeholder', !transcript)
      answer.textContent = translation || '…'
      answer.lang = locales[targetLanguage()]
      answer.classList.toggle('placeholder', !translation)
      start.disabled = !canRecord || Boolean(recording && !listening)
      start.dataset.listening = String(listening)
      start.innerHTML = listening
        ? '<span aria-hidden="true">■</span> Стоп'
        : '<span aria-hidden="true">🎤</span> Старт'
      translate.disabled = !transcript || Boolean(recording || request) || Boolean(translation)
      replay.hidden = !translation || !canSpeak
    }

    function resetRound() {
      const previous = recording
      recording = null
      if (previous) previous.abort()
      if (request) request.abort()
      request = null
      listening = false
      transcript = ''
      translation = ''
      if (canSpeak) synthesis.cancel()
      if (canSpeak) showVoiceNotice()
      setStatus(source === 'en'
        ? 'Нажмите «Старт» и скажите слово по-английски'
        : 'Нажмите «Старт» и скажите слово по-русски')
      update()
    }

    function speak(text, language) {
      if (!canSpeak) return
      showVoiceNotice()
      synthesis.cancel()
      const utterance = new SpeechSynthesisUtterance(text)
      utterance.lang = locales[language]
      const voices = synthesis.getVoices()
      const voice = voices.find((item) => item.lang === utterance.lang) ||
        voices.find((item) => item.lang.toLowerCase().split(/[-_]/)[0] === language)
      if (voice) utterance.voice = voice
      utterance.rate = .85
      utterance.onerror = ({ error }) => {
        if (!['canceled', 'interrupted'].includes(error)) {
          showVoiceNotice(error === 'not-allowed'
            ? 'Браузер ждёт нажатия. Нажмите «Повторить», чтобы услышать перевод'
            : 'Озвучка недоступна. Проверьте, установлен ли голос для этого языка')
        }
      }
      synthesis.speak(utterance)
    }

    start.addEventListener('click', () => {
      if (recording && listening) {
        listening = false
        recording.stop()
        setStatus('Распознаём слово…')
        update()
        return
      }
      if (!canRecord || recording) return
      resetRound()
      const recognition = new SpeechRecognition()
      recording = recognition
      recognition.lang = locales[source]
      recognition.interimResults = false
      recognition.continuous = false
      let failed = false
      recognition.onstart = () => {
        if (recording !== recognition) return
        listening = true
        setStatus('Слушаю… Произнесите слово')
        update()
      }
      recognition.onresult = (event) => {
        if (recording !== recognition) return
        transcript = event.results[event.resultIndex][0].transcript.trim()
        listening = false
        setStatus(transcript ? 'Вспомните значение, затем нажмите «Перевод»' : 'Слово не распознано. Попробуйте ещё раз', !transcript)
        update()
      }
      recognition.onerror = ({ error }) => {
        if (recording !== recognition) return
        failed = true
        listening = false
        const messages = {
          'not-allowed': 'Разрешите доступ к микрофону в настройках браузера и попробуйте снова',
          'service-not-allowed': 'Служба распознавания недоступна. Проверьте настройки браузера',
          'audio-capture': 'Микрофон недоступен. Проверьте, подключён ли он',
          'no-speech': 'Речь не слышна. Нажмите «Старт» и произнесите слово ещё раз',
          'network': 'Сбой службы распознавания. Проверьте интернет или попробуйте другой браузер',
          'language-not-supported': 'Браузер не распознаёт речь на выбранном языке'
        }
        setStatus(messages[error] || 'Запись прервалась. Попробуйте ещё раз', true)
        update()
      }
      recognition.onend = () => {
        if (recording !== recognition) return
        recording = null
        listening = false
        if (!transcript && !failed) setStatus('Слово не распознано. Попробуйте ещё раз', true)
        update()
      }
      setStatus('Подключаем микрофон…')
      update()
      try {
        recognition.start()
      } catch {
        recording = null
        setStatus('Не удалось включить микрофон. Проверьте разрешения браузера', true)
        update()
      }
    })

    function readTranslation(data, word, target) {
      const expectedScript = target === 'ru' ? /\p{Script=Cyrillic}/u : /\p{Script=Latin}/u
      const normalize = (text) => text.trim().toLowerCase().replace(/[.!?]+$/, '')
      const usable = (text) => typeof text === 'string' && expectedScript.test(text) &&
        normalize(text) !== normalize(word)
      const primary = data.responseData?.translatedText
      if (usable(primary)) return primary.trim()

      // MyMemory sometimes ranks an untranslated match above a valid translation.
      const exact = Array.isArray(data.matches) ? data.matches.filter((item) =>
        typeof item?.segment === 'string' && normalize(item.segment) === normalize(word) &&
        usable(item.translation)
      ) : []
      const sameLength = exact.find((item) =>
        item.translation.trim().split(/\s+/).length === word.split(/\s+/).length
      )
      return (sameLength || exact[0])?.translation.trim() || ''
    }

    translate.addEventListener('click', async () => {
      if (!transcript || recording || request || translation) return
      if (new TextEncoder().encode(transcript).length > 500) {
        setStatus('Фраза слишком длинная. Нажмите «Старт» и скажите одно слово или короткую фразу', true)
        return
      }

      const word = transcript
      const language = source
      const target = targetLanguage()
      const controller = new AbortController()
      request = controller
      if (canSpeak && !voicePrimed) {
        // iOS can require a direct tap before the first synthesized utterance.
        const unlock = new SpeechSynthesisUtterance(' ')
        unlock.lang = locales[target]
        unlock.volume = 0
        synthesis.speak(unlock)
        voicePrimed = true
      }
      setStatus('Запрашиваем перевод…')
      update()
      const timeout = setTimeout(() => controller.abort(), 14000)
      const url = new URL('https://api.mymemory.translated.net/get')
      url.search = new URLSearchParams({ q: word, langpair: `${language}|${target}` })

      try {
        const response = await fetch(url, { signal: controller.signal })
        if (request !== controller) return
        if (response.status === 429) {
          setStatus('Достигнут лимит MyMemory. Попробуйте позже', true)
          return
        }
        if (!response.ok) throw new Error('HTTP ' + response.status)
        const data = await response.json()
        if (request !== controller) return
        if (data.quotaFinished || Number(data.responseStatus) === 429) {
          setStatus('Достигнут лимит MyMemory. Попробуйте позже', true)
          return
        }
        if (Number(data.responseStatus) !== 200) throw new Error('MyMemory response')
        const result = readTranslation(data, word, target)
        if (!result) {
          setStatus('Сервис не вернул перевод на нужном языке. Попробуйте сказать слово в короткой фразе', true)
          return
        }
        translation = result
        save(word, result, language)
        setStatus('Перевод готов')
        speak(result, target)
      } catch {
        if (request !== controller) return
        setStatus(controller.signal.aborted
          ? 'Сервис перевода долго не отвечает. Нажмите «Перевод» ещё раз'
          : 'Сервис перевода недоступен. Проверьте интернет и попробуйте снова', true)
      } finally {
        clearTimeout(timeout)
        if (request === controller) {
          request = null
          update()
        }
      }
    })

    replay.addEventListener('click', () => speak(translation, targetLanguage()))
    for (const mode of document.querySelectorAll('input[name="mode"]')) {
      mode.addEventListener('change', () => {
        if (!mode.checked) return
        source = mode.value
        resetRound()
      })
    }

    resetRound()
    renderHistory()
    if (!canRecord) {
      micNotice.textContent = SpeechRecognition
        ? 'Микрофону нужен защищённый адрес. Откройте страницу через HTTPS или localhost'
        : 'Этот браузер не поддерживает распознавание речи. Попробуйте Google Chrome или Safari с включённой Siri'
      micNotice.hidden = false
      setStatus('')
    }
    if (!canSpeak) showVoiceNotice('Озвучка недоступна в этом браузере')
  </script>
</body>
</html>
